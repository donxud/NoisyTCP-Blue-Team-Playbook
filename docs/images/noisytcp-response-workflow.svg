<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="NoisyTCP response workflow: decide per host whether to patch, mitigate or schedule">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#57606a"/></marker>
  </defs>
  <rect width="1000" height="790" fill="#ffffff"/>
  <text x="500" y="34" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2328">Per-host decision: patch now, mitigate now, or schedule</text>

  <g stroke="#57606a" stroke-width="1.5" fill="none">
    <path d="M400 112V133" marker-end="url(#a)"/>
    <path d="M400 215V258" marker-end="url(#a)"/>
    <path d="M400 340V383" marker-end="url(#a)"/>
    <path d="M400 465V503" marker-end="url(#a)"/>
    <path d="M400 567V593" marker-end="url(#a)"/>
    <path d="M400 657V683" marker-end="url(#a)"/>
    <path d="M530 175H678" marker-end="url(#a)"/>
    <path d="M530 300H678" marker-end="url(#a)"/>
    <path d="M530 425H678" marker-end="url(#a)"/>
  </g>

  <!-- start -->
  <rect x="120" y="50" width="560" height="62" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="400" y="76" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Inventory every Linux host (tools/noisytcp_check.sh)</text>
  <text x="400" y="98" text-anchor="middle" font-size="12" fill="#57606a">kernel package · TCP listeners · RX queues / RPS · tcp_syncookies</text>

  <!-- decisions -->
  <g fill="#ffffff" stroke="#57606a" stroke-width="1.2">
    <polygon points="400,135 530,175 400,215 270,175"/>
    <polygon points="400,260 530,300 400,340 270,300"/>
    <polygon points="400,385 530,425 400,465 270,425"/>
  </g>
  <g font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">
    <text x="400" y="180">Fixed kernel booted?</text>
    <text x="400" y="305">Exposed?</text>
    <text x="400" y="430">Can reboot now?</text>
  </g>
  <g font-size="12" fill="#57606a">
    <text x="256" y="294" text-anchor="end">reachable TCP listener</text>
    <text x="256" y="312" text-anchor="end">and more than one RX queue or RPS</text>
    <text x="540" y="166">yes</text>
    <text x="540" y="291">no</text>
    <text x="540" y="416">yes</text>
    <text x="410" y="242">no</text>
    <text x="410" y="367">yes</text>
    <text x="410" y="489">no</text>
  </g>

  <!-- right outcomes -->
  <g font-size="12" fill="#1f2328">
    <rect x="680" y="143" width="290" height="64" rx="10" fill="#dafbe1" stroke="#1a7f37" stroke-width="1.5"/>
    <text x="825" y="168" text-anchor="middle" font-size="14" font-weight="700">Verified: close</text>
    <text x="825" y="190" text-anchor="middle" fill="#57606a">check package vs vendor advisory, not uname</text>

    <rect x="680" y="268" width="290" height="64" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
    <text x="825" y="293" text-anchor="middle" font-size="14" font-weight="700">Patch in normal window</text>
    <text x="825" y="315" text-anchor="middle" fill="#57606a">still vulnerable; re-check if config changes</text>

    <rect x="680" y="393" width="290" height="64" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
    <text x="825" y="418" text-anchor="middle" font-size="14" font-weight="700">Patch and reboot now</text>
    <text x="825" y="440" text-anchor="middle" fill="#57606a">internet-facing first; verify after boot</text>
  </g>

  <!-- main lane tail -->
  <rect x="140" y="505" width="520" height="62" rx="10" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5"/>
  <text x="400" y="531" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Mitigate now (change-approved)</text>
  <text x="400" y="553" text-anchor="middle" font-size="12" fill="#57606a">tcp_syncookies=0 in every netns, or one RX queue + RPS off; edge SYN-flood protection</text>

  <rect x="140" y="595" width="520" height="62" rx="10" fill="#f6f8fa" stroke="#57606a" stroke-width="1.2"/>
  <text x="400" y="621" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Monitor with the SIEM rules until patched</text>
  <text x="400" y="643" text-anchor="middle" font-size="12" fill="#57606a">SYN-flood messages · oops in tcp_v4_rcv · unexpected reboots · mitigation drift</text>

  <rect x="140" y="685" width="520" height="62" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="400" y="711" text-anchor="middle" font-size="15" font-weight="700" fill="#1f2328">Patch and reboot in the next window</text>
  <text x="400" y="733" text-anchor="middle" font-size="12" fill="#57606a">verify the fix, then remove the workaround and restore SYN cookies</text>
</svg>
